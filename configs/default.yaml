project: graphguard
seed: 42

data:
  dataset: elliptic          # elliptic | ieee_cis | paysim
  raw_dir: data/raw
  processed_dir: data/processed
  temporal_split: true       # train on past time-steps, test on future
  train_ratio: 0.7

graph:
  node_types: [account, device, merchant, transaction]
  k_hops: 2
  add_shared_device_edges: true

model:
  encoder: graphsage
  hidden_dim: 128
  num_layers: 2
  gat_heads: 4
  dropout: 0.3
  use_autoencoder_head: true

train:
  epochs: 100
  lr: 0.001
  weight_decay: 0.0005
  batch_size: 1024
  class_weight: auto         # handles fraud/non-fraud imbalance
  early_stopping_patience: 15

explain:
  method: gnnexplainer
  epochs: 200
  top_k_edges: 10

ring:
  community_method: louvain
  min_ring_size: 3
  score_threshold: 0.7
